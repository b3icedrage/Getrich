name: GROK Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "TTTCML/Grok/**"
      - ".github/workflows/grok-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Configure persistent signing key
        env:
          GROK_KEYSTORE_BASE64: ${{ secrets.GROK_KEYSTORE_BASE64 }}
          GROK_KEYSTORE_PASSWORD: ${{ secrets.GROK_KEYSTORE_PASSWORD }}
        run: |
          test -n "$GROK_KEYSTORE_BASE64" || (echo "Missing GROK_KEYSTORE_BASE64 repository secret"; exit 1)
          test -n "$GROK_KEYSTORE_PASSWORD" || (echo "Missing GROK_KEYSTORE_PASSWORD repository secret"; exit 1)
          echo "$GROK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/grok-upload-key.jks"
          echo "GROK_KEYSTORE_PATH=$RUNNER_TEMP/grok-upload-key.jks" >> "$GITHUB_ENV"
          echo "GROK_KEYSTORE_PASSWORD=$GROK_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: TTTCML/Grok
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GROK-debug-apk
          path: TTTCML/Grok/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
